<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorstand (Test)</title>

<!-- Firebase SDK (nur jeweils einmal eingebunden) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{background:#000;color:white;font-family:Arial, sans-serif;text-align:center;margin:0;}
.logo{height:150px;margin:20px auto;display:block;}
.container{max-width:700px;margin:auto;padding:10px;}

button{padding:10px;border:none;border-radius:10px;cursor:pointer;font-weight:bold;margin:5px;}
.orange{background:orange;color:black;}
.red{background:red;color:white;}

.msg{background:#1e1e1e;margin:10px 0;padding:14px;border-radius:14px;text-align:left;}
.msg.Kritik{border-left:4px solid #ff4444;color:#ff4444;}
.msg.Lob{border-left:4px solid #00ff99;color:#00ff99;}
.msg.Frage{border-left:4px solid #00bfff;color:#00bfff;}
.msg.Vorschlag{border-left:4px solid #ffaa00;color:#ffaa00;}

.blink{animation:blink 1s infinite;}
@keyframes blink{
  0%{box-shadow:0 0 5px currentColor;}
  50%{box-shadow:0 0 20px currentColor;}
  100%{box-shadow:0 0 5px currentColor;}
}

.legend span{margin:0 8px;font-weight:bold;}
.kritik{color:#ff4444;}
.lob{color:#00ff99;}
.frage{color:#00bfff;}
.vorschlag{color:#ffaa00;}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <img src="logo.png" class="logo" alt="Logo">
  <h2>👑 Vorstand Login</h2>
  <input id="pw" type="password" placeholder="Passwort">
  <button onclick="login()">Login</button>
  <div id="error" style="color:red; margin-top:10px;"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCFjuJ-XSN0YnvAilerXPkXbw2iR2ixBv8",
  authDomain: "kritik-system.firebaseapp.com",
  databaseURL: "https://kritik-system-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kritik-system"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let all = [];
let adminId = "";

// 🔐 LOGIN (Repariert: prüft Firebase und akzeptiert 3124 als Master-Passwort)
function login(){
  const pw = document.getElementById("pw").value.trim();
  const errorBox = document.getElementById("error");
  errorBox.innerText = "Prüfe Code...";

  // 1. Sofortiger Abgleich mit dem bekannten Code 3124
  if (pw === "3124") {
    localStorage.setItem("adminLogin", "true");
    localStorage.setItem("adminLoginTime", Date.now());
    start();
    return;
  }

  // 2. Abgleich mit der Firebase-Datenbank (falls online geändert)
  db.ref("test/settings/adminPassword").once("value")
    .then(snap => {
      const adminPw = snap.val();
      if (adminPw !== null && pw === String(adminPw).trim()) {
        localStorage.setItem("adminLogin", "true");
        localStorage.setItem("adminLoginTime", Date.now());
        start();
      } else {
        errorBox.innerText = "Falscher Code";
      }
    })
    .catch(err => {
      console.warn("Firebase-Abfrage fehlgeschlagen:", err);
      errorBox.innerText = "Falscher Code (oder keine Datenbank-Berechtigung)";
    });
}

// AUTO LOGIN
if(localStorage.getItem("adminLoginTime")){
  start();
}

// 🚀 START
function start(){
  const loginDiv = document.getElementById("login");
  if (loginDiv) loginDiv.style.display = "none";

  document.body.innerHTML = `
  <img src="logo.png" class="logo" alt="Logo">
  <div class="container">
    <h2>👑 Vorstand Live</h2>
    <div id="online"></div>

    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
      <div>
        <button class="orange" onclick="newPassword()">Mitglieder Passwort</button>
        <div id="pwBox"></div>
      </div>
      <div>
        <button class="orange" onclick="newArchivePassword()">Archiv Passwort</button>
        <div id="archivePwBox"></div>
      </div>
    </div>

    <br>

    <button class="red" onclick="kickMembers()">Mitglieder kicken</button>
    <button class="red" onclick="kickAdmins()">Vorstand kicken</button>

    <div class="legend">
      <span class="kritik">■ Kritik</span>
      <span class="lob">■ Lob</span>
      <span class="frage">■ Frage</span>
      <span class="vorschlag">■ Vorschlag</span>
    </div>

    <div id="chat"></div>
  </div>
  `;

  adminId = localStorage.getItem("adminId") || Date.now().toString();
  localStorage.setItem("adminId", adminId);

  const ref = db.ref("test/admins/" + adminId);
  ref.set(true);
  ref.onDisconnect().remove();

  // KICK CHECK
  db.ref("test/settings/forceLogoutAdmins").on("value", snap => {
    const logoutTime = snap.val();
    const myTime = Number(localStorage.getItem("adminLoginTime"));

    if(logoutTime && myTime && Number(logoutTime) > myTime){
      alert("Du wurdest gekickt!");
      localStorage.removeItem("adminLoginTime");
      localStorage.removeItem("adminLogin");
      location.reload();
    }
  });

  // Passwörter synchronisieren
  db.ref("test/settings/memberPassword").on("value", snap => {
    const pw = snap.val();
    const box = document.getElementById("pwBox");
    if(pw && box) box.innerText = "Code: " + pw;
  });

  db.ref("test/settings/archivePassword").on("value", snap => {
    const pw = snap.val();
    const box = document.getElementById("archivePwBox");
    if(pw && box) box.innerText = "Archiv Code: " + pw;
  });

  loadOnline();
  loadMessages();
}

// 👥 ONLINE
function loadOnline(){
  db.ref("test/admins").on("value", a => {
    const admins = a.numChildren();
    db.ref("test/members").once("value", m => {
      const members = m.numChildren();
      const onlineEl = document.getElementById("online");
      if(onlineEl){
        onlineEl.innerText = "👑 Vorstand: " + admins + " | 👥 Mitglieder: " + members;
      }
    });
  });
}

// 🔑 PASSWÖRTER
function newPassword(){
  if(!confirm("Neues Mitglieder-Passwort erstellen und alle rauswerfen?")) return;
  const pw = Math.floor(1000 + Math.random() * 9000);
  db.ref("test/settings/memberPassword").set(pw);
  db.ref("test/settings/forceLogoutMembers").set(Date.now());
  db.ref("test/members").remove();
  const box = document.getElementById("pwBox");
  if(box) box.innerText = "Code: " + pw;
}

function newArchivePassword(){
  if(!confirm("Neues Archiv-Passwort setzen? Alle werden ausgeloggt!")) return;
  const pw = Math.floor(1000 + Math.random() * 9000);
  db.ref("test/settings/archivePassword").set(pw);
  db.ref("test/settings/forceLogoutArchive").set(Date.now());
  const box = document.getElementById("archivePwBox");
  if(box) box.innerText = "Archiv Code: " + pw;
}

// 🚫 KICK
function kickMembers(){
  if(!confirm("Wirklich ALLE Mitglieder kicken?")) return;
  db.ref("test/settings/forceLogoutMembers").set(Date.now());
  db.ref("test/members").remove();
}

function kickAdmins(){
  if(!confirm("Wirklich den gesamten Vorstand kicken?")) return;
  db.ref("test/settings/forceLogoutAdmins").set(Date.now());
  db.ref("test/admins").remove();
}

// 🔥 MESSAGES
function formatTimeAgo(timestamp){
  if(!timestamp) return "";
  const diff = Math.floor((Date.now() - timestamp) / 1000);
  if(diff < 60) return "gerade eben";
  if(diff < 3600){
    const m = Math.floor(diff / 60);
    return "vor " + m + " Minute" + (m > 1 ? "n" : "");
  }
  if(diff < 86400){
    const h = Math.floor(diff / 3600);
    return "vor " + h + " Stunde" + (h > 1 ? "n" : "");
  }
  const d = Math.floor(diff / 86400);
  return "vor " + d + " Tag" + (d > 1 ? "en" : "");
}

function loadMessages(){
  db.ref("test/feedback").on("child_added", snap => {
    const msg = { id: snap.key, ...snap.val(), isNew: true };
    all.push(msg);
    setTimeout(() => { msg.isNew = false; render(); }, 15000);
    render();
  });

  db.ref("test/feedback").on("child_removed", snap => {
    all = all.filter(m => m.id !== snap.key);
    render();
  });
}

// RENDER
function render(){
  const chat = document.getElementById("chat");
  if(!chat) return;
  chat.innerHTML = "";

  all.slice().reverse().forEach(m => {
    if(!m.text || !m.type) return;
    const div = document.createElement("div");
    div.className = "msg " + m.type + (m.isNew ? " blink" : "");
    div.innerHTML = `
      <b>${m.type}</b><br>
      ${m.text}<br>
      <small style="opacity:0.6;">${formatTimeAgo(m.time)}</small><br><br>
      <button class="red" onclick="deleteMsg('${m.id}')">Löschen</button>
    `;
    chat.appendChild(div);
  });
}

// 🧹 DELETE
function deleteMsg(id){
  if(localStorage.getItem("adminLogin") !== "true"){
    alert("Nur Vorstand darf löschen!");
    return;
  }

  const pw = prompt("Vorstand Passwort bestätigen:");

  // Prüft gegen 3124 oder Firebase
  if(pw === "3124"){
    proceedDelete(id);
    return;
  }

  db.ref("test/settings/adminPassword").once("value", snap => {
    const adminPw = snap.val();
    if(pw === String(adminPw)){
      proceedDelete(id);
    } else {
      alert("Falsches Passwort!");
    }
  });
}

function proceedDelete(id){
  const msg = all.find(m => m.id === id);
  if(msg){
    db.ref("test/archive/" + id).set({
      text: msg.text,
      type: msg.type,
      time: msg.time,
      status: "gelöscht",
      deletedAt: Date.now()
    });
  }
  db.ref("test/feedback/" + id).remove();
}
</script>
</body>
</html>
